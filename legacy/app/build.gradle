plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.oriontv.legacy'
    compileSdk 34

    defaultConfig {
        applicationId "com.oriontv.legacy"
        // 目标是 Android 4.4（API 19/20）的老电视盒子
        minSdk 19
        targetSdk 28
        versionCode 1001
        versionName "1.0.0-test.1"

        // minSdk < 21 没有原生 multidex，必须显式开启
        multiDexEnabled true
    }

    signingConfigs {
        // 与主线同一张调试证书（包名不同，互不覆盖），保证后续版本能直接覆盖安装
        legacy {
            storeFile file("legacy.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.legacy
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.multidex:multidex:2.0.1'

    // ExoPlayer 2.x 是最后一个支持 API 16 的分支；Media3 要求 API 21，这里不能用
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.18.7'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.18.7'

    // OkHttp 3.12 仍支持 API 19，且自带 4.4 上的 TLS 1.2 兜底
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
